<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stratum — Dermatology, layer by layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1420; --ink-2:#251C30; --ink-3:#2E2339;
    --parchment:#F3EAE4; --parchment-dim:#C7BAC0;
    --eosin:#E85C7B; --eosin-dim:#8C4053;
    --hema:#8B7FC7; --hema-dim:#564E82;
    --keratin:#E0AA52; --keratin-dim:#8C6F3B;
    --tissue:#74B394; --tissue-dim:#3E6753;
    --alert:#E06457;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);}
  body{font-family:'Inter',system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:rgba(27,20,32,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(243,234,228,0.08);
  }
  .brand{display:flex; align-items:baseline; gap:8px; cursor:pointer;}
  .brand .word{font-size:20px; font-weight:700; letter-spacing:0.5px;}
  .stats{display:flex; gap:14px; align-items:center;}
  .stat{display:flex; align-items:center; gap:5px; font-size:14px;}
  .stat .n{font-weight:600;}
  .stat.streak .n{color:var(--keratin);}
  .stat.xp .n{color:var(--eosin);}
  .back-btn{background:none;border:none;color:var(--parchment);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;}

  /* ---------- Dashboard ---------- */
  .dash-hero{
    margin:22px 20px 10px; border-radius:26px; padding:30px 24px;
    background:linear-gradient(160deg, #3A2A45, #241B2E 65%);
    border:1px solid rgba(243,234,228,0.08); cursor:pointer; position:relative; overflow:hidden;
  }
  .dash-hero::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle 180px at 85% -10%, rgba(232,92,123,0.20), transparent 70%),
               radial-gradient(circle 160px at -10% 110%, rgba(139,127,199,0.18), transparent 70%);
  }
  .dash-hero .eyebrow{position:relative; font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--parchment-dim);}
  .dash-hero h1{position:relative; font-size:34px; margin:8px 0 10px;}
  .dash-hero .sub{position:relative; font-size:14px; color:var(--parchment-dim); line-height:1.5;}
  .dash-hero .arrow{position:relative; margin-top:16px; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--eosin);}

  .dash-stats{display:flex; gap:12px; margin:16px 20px;}
  .dash-stat-card{flex:1; background:var(--ink-2); border-radius:16px; padding:14px; text-align:center; border:1px solid rgba(243,234,228,0.06);}
  .dash-stat-card .v{font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .dash-stat-card .l{font-size:11px; color:var(--parchment-dim); margin-top:2px;}

  /* ---------- Chapter list ---------- */
  .clist-title{padding:18px 20px 4px; font-size:24px; font-weight:600;}
  .clist-sub{padding:0 20px 16px; font-size:13px; color:var(--parchment-dim);}
  .chapter-row{
    display:flex; align-items:center; gap:14px; margin:0 20px 10px; padding:14px 16px;
    background:var(--ink-2); border-radius:16px; border:1px solid rgba(243,234,228,0.06);
  }
  .chapter-row.built{cursor:pointer;}
  .chapter-row.locked{opacity:0.45;}
  .chapter-row .cnum{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; flex-shrink:0;
    background:var(--ink-3); color:var(--parchment-dim);
  }
  .chapter-row.built .cnum{background:linear-gradient(155deg, var(--eosin), var(--eosin-dim)); color:#fff;}
  .chapter-row .ctitle{flex:1; font-size:14.5px; font-weight:600; line-height:1.3;}
  .chapter-row .ctag{font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase; color:var(--parchment-dim); white-space:nowrap;}
  .chapter-row .cprog{font-size:11px; color:var(--tissue); white-space:nowrap;}

  /* ---------- Map / zones (generalized by hue) ---------- */
  .chapter-label{padding:18px 20px 6px; color:var(--parchment-dim); font-size:12px; letter-spacing:1.2px; text-transform:uppercase;}
  .chapter-title{padding:0 20px 18px; font-size:26px; font-weight:600; line-height:1.15;}
  .zone{position:relative; padding:34px 20px 34px; display:flex; flex-direction:column; align-items:center; gap:26px;}
  .zone::before{content:''; position:absolute; inset:0; z-index:0; pointer-events:none;}
  .zone-gold::before{background:repeating-linear-gradient(180deg, rgba(224,170,82,0.10) 0 3px, rgba(224,170,82,0.02) 3px 9px);}
  .zone-purple::before{background:radial-gradient(ellipse 60% 40% at 30% 20%, rgba(139,127,199,0.14), transparent 70%), radial-gradient(ellipse 60% 40% at 75% 70%, rgba(139,127,199,0.10), transparent 70%);}
  .zone-green::before{background:radial-gradient(circle 70px at 20% 30%, rgba(116,179,148,0.10), transparent 75%), radial-gradient(circle 90px at 75% 60%, rgba(116,179,148,0.08), transparent 75%), radial-gradient(circle 60px at 45% 80%, rgba(116,179,148,0.09), transparent 75%);}
  .zone-pink::before{background:radial-gradient(circle 220px at 50% 40%, rgba(232,92,123,0.16), transparent 70%);}
  .zone-heading{position:relative; z-index:1; align-self:flex-start; margin-left:6px; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--parchment-dim); display:flex; align-items:center; gap:8px;}
  .zone-heading .ln{width:22px; height:1px; background:currentColor; opacity:0.4;}
  .zone-connector{position:relative; z-index:1; width:2px; height:22px; background:repeating-linear-gradient(180deg, rgba(243,234,228,0.25) 0 4px, transparent 4px 8px); margin:-14px auto;}

  .node-wrap{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .node{width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:26px; font-weight:600; cursor:pointer; border:none; position:relative; transition:transform 0.15s ease;}
  .node:active{transform:scale(0.94);}
  .node.locked{background:var(--ink-3); color:var(--parchment-dim); cursor:default;}
  .node.locked:active{transform:none;}
  .node.hue-gold.unlocked{background:linear-gradient(155deg, var(--keratin), var(--keratin-dim)); box-shadow:0 0 0 5px rgba(224,170,82,0.18), 0 8px 20px rgba(224,170,82,0.25); color:#fff;}
  .node.hue-purple.unlocked{background:linear-gradient(155deg, var(--hema), var(--hema-dim)); box-shadow:0 0 0 5px rgba(139,127,199,0.18), 0 8px 20px rgba(139,127,199,0.25); color:#fff;}
  .node.hue-green.unlocked{background:linear-gradient(155deg, var(--tissue), var(--tissue-dim)); box-shadow:0 0 0 5px rgba(116,179,148,0.18), 0 8px 20px rgba(116,179,148,0.25); color:#fff;}
  .node.hue-pink.unlocked{background:linear-gradient(155deg, var(--eosin), var(--eosin-dim)); box-shadow:0 0 0 5px rgba(232,92,123,0.18), 0 8px 20px rgba(232,92,123,0.25); color:#fff;}
  .node.done{background:linear-gradient(155deg, var(--tissue), var(--tissue-dim)); color:#fff;}
  .node .lock-ic{font-size:22px;}
  .node-label{font-size:13px; font-weight:600; text-align:center; max-width:120px; line-height:1.25;}
  .node-stars{font-size:12px; color:var(--keratin); letter-spacing:1px; height:14px;}

  .review-fab{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--alert); color:#fff; border:none;
    border-radius:30px; padding:12px 20px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;
    box-shadow:0 10px 24px rgba(224,100,87,0.4); cursor:pointer; z-index:30; max-width:400px; width:calc(100% - 40px); justify-content:center;
  }
  .review-fab .badge{background:rgba(255,255,255,0.25); border-radius:10px; padding:1px 8px; font-size:12px;}

  /* ---------- Unit intro / Guide ---------- */
  .screen{padding:0 20px 30px;}
  .unit-hero{padding:22px 0 10px;}
  .unit-hero .eyebrow{font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--parchment-dim);}
  .unit-hero h2{font-size:26px; margin:6px 0 0; line-height:1.2;}
  .guide-card{background:var(--ink-2); border-radius:var(--radius); padding:20px; margin:18px 0; border:1px solid rgba(243,234,228,0.06);}
  .guide-card h3{font-size:13px; letter-spacing:0.8px; text-transform:uppercase; color:var(--parchment-dim); margin:0 0 12px;}
  .guide-card ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:10px;}
  .guide-card li{font-size:15px; line-height:1.5;}
  .guide-card li b{color:var(--keratin); font-weight:600;}

  .layer-diagram{display:flex; flex-direction:column; border-radius:12px; overflow:hidden; margin:16px 0;}
  .layer-band{padding:9px 14px; font-size:12.5px; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .layer-band .note{font-weight:400; font-size:11px; opacity:0.75;}
  .lb1{background:#F3EAE4; color:#1B1420;} .lb2{background:#DCC9A8; color:#1B1420;}
  .lb3{background:#C7A96E; color:#1B1420;} .lb4{background:#B08947; color:#1B1420;} .lb5{background:#8C6F3B; color:#fff;}

  .rete-diagram{display:flex; gap:10px; margin:16px 0;}
  .rete-box{flex:1; background:var(--ink-3); border-radius:12px; padding:12px; text-align:center;}
  .rete-box svg{width:100%; height:auto;}
  .rete-box .cap{font-size:11.5px; margin-top:8px; color:var(--parchment-dim); line-height:1.4;}
  .rete-box .cap b{color:var(--parchment);}

  .cell-card{background:var(--ink-3); border-radius:14px; padding:14px 16px; margin-bottom:10px; border-left:3px solid var(--keratin);}
  .cell-card.mel{border-left-color:var(--hema);} .cell-card.mer{border-left-color:var(--tissue);}
  .cell-card .cname{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-bottom:4px;}
  .cell-card .cfact{font-size:13px; color:var(--parchment-dim); line-height:1.5;}
  .cell-card .cfact b{color:var(--parchment); font-weight:600;}

  .primary-btn{width:100%; padding:16px; border-radius:16px; border:none; margin-top:8px; background:linear-gradient(155deg, var(--eosin), var(--eosin-dim)); color:#fff; font-size:16px; font-weight:600; cursor:pointer;}
  .primary-btn:active{transform:scale(0.98);}
  .secondary-btn{width:100%; padding:14px; border-radius:16px; margin-top:10px; cursor:pointer; background:none; border:1px solid rgba(243,234,228,0.2); color:var(--parchment); font-size:15px; font-weight:600;}
  .meta-row{display:flex; gap:16px; margin:14px 0 0; font-size:13px; color:var(--parchment-dim);}

  /* ---------- Quiz ---------- */
  .progress-track{height:8px; background:var(--ink-3); border-radius:6px; margin:16px 0 26px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--keratin), var(--eosin)); border-radius:6px; transition:width 0.3s ease;}
  .q-count{font-size:12px; color:var(--parchment-dim); margin-bottom:6px; letter-spacing:0.5px;}
  .q-prompt{font-size:21px; font-weight:600; line-height:1.35; margin-bottom:22px; font-family:'Fraunces',serif;}
  .option{display:block; width:100%; text-align:left; padding:16px 18px; margin-bottom:12px; border-radius:14px; border:1.5px solid rgba(243,234,228,0.15); background:var(--ink-2); color:var(--parchment); font-size:15.5px; cursor:pointer; line-height:1.4;}
  .option:active{transform:scale(0.985);}
  .option.correct{border-color:var(--tissue); background:rgba(116,179,148,0.16);}
  .option.wrong{border-color:var(--alert); background:rgba(224,100,87,0.16);}
  .option.dim{opacity:0.45;}
  .option[disabled]{cursor:default;}

  .feedback{margin-top:8px; padding:16px 18px; border-radius:14px; font-size:14.5px; line-height:1.55; display:flex; gap:10px; align-items:flex-start;}
  .feedback.ok{background:rgba(116,179,148,0.14); color:var(--parchment);}
  .feedback.no{background:rgba(224,100,87,0.14); color:var(--parchment);}
  .feedback .ic{font-size:18px; margin-top:1px;}
  .xp-pop{position:fixed; top:70px; right:24px; background:var(--eosin); color:#fff; padding:6px 12px; border-radius:20px; font-size:13px; font-weight:700; z-index:40; animation:pop 1.1s ease forwards;}
  @keyframes pop{ 0%{opacity:0; transform:translateY(6px);} 15%{opacity:1; transform:translateY(0);} 75%{opacity:1;} 100%{opacity:0; transform:translateY(-14px);} }

  /* ---------- Results ---------- */
  .results-wrap{padding:50px 20px 30px; text-align:center;}
  .results-ring{width:150px; height:150px; border-radius:50%; margin:0 auto 22px; display:flex; align-items:center; justify-content:center; flex-direction:column; background:conic-gradient(var(--keratin) calc(var(--pct)*1%), var(--ink-3) 0);}
  .results-ring .inner{width:122px; height:122px; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .results-ring .pctnum{font-size:30px; font-weight:700; font-family:'Fraunces',serif;}
  .results-ring .pctlbl{font-size:11px; color:var(--parchment-dim); letter-spacing:0.5px;}
  .results-stars{font-size:30px; letter-spacing:6px; color:var(--keratin); margin-bottom:6px;}
  .results-wrap h2{font-size:24px; margin:4px 0 20px;}
  .results-row{display:flex; justify-content:center; gap:26px; margin-bottom:26px;}
  .results-row .rstat{text-align:center;}
  .results-row .rstat .v{font-size:19px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .results-row .rstat .l{font-size:11px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .empty-note{color:var(--parchment-dim); font-size:14px; text-align:center; padding:40px 20px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   ORIGINAL content written to teach the concepts in the source
   chapters — guides, questions, and explanations are all in my
   own words, not reproduced from any source text.
   ============================================================ */

const CH1_UNITS = [
  {
    id:'u1', num:1, zone:'epi',
    title:'Skin Layers & the Epidermis',
    guide:{ bullets:[
        'Skin has three main layers, outside in: <b>epidermis → dermis → hypodermis.</b>',
        'The epidermis is <b>stratified squamous epithelium</b>, built in five sublayers.',
        'Outer to inner: <b>corneum → lucidum → granulosum → spinosum → basale.</b>',
        'Stratum corneum is dead, anucleate, keratin-packed — pure barrier tissue.',
        'Stratum lucidum only exists in thick skin — palms and soles.',
        'Stratum granulosum builds two granule types: <b>keratohyaline granules</b> and <b>lamellar granules</b> (a.k.a. Odland bodies / cementosomes).'
      ], diagram:'epidermis' },
    questions:[
      {prompt:"Going from the surface inward, what's the correct order of skin's three main layers?", options:["Epidermis → Dermis → Hypodermis","Dermis → Epidermis → Hypodermis","Hypodermis → Dermis → Epidermis","Epidermis → Hypodermis → Dermis"], answer:0, explain:"The epidermis faces outward, sitting above the dermis, which sits above the fatty hypodermis."},
      {prompt:"Histologically, the epidermis is classified as:", options:["Simple columnar epithelium","Stratified squamous epithelium","Transitional epithelium","Pseudostratified ciliated epithelium"], answer:1, explain:"Multiple stacked layers of flattened cells — the definition of stratified squamous."},
      {prompt:"Which layer is made of fully keratinized, dead cells with no nucleus?", options:["Stratum granulosum","Stratum spinosum","Stratum corneum","Stratum basale"], answer:2, explain:"'Corneum' = keratin. These dead, flattened corneocytes form the outermost shield."},
      {prompt:"The stratum corneum's barrier function works in two directions. What does it block?", options:["Only microbe entry","Only water loss","Entry of microbes/irritants AND exit of water","Entry of oxygen only"], answer:2, explain:"It's a two-way barrier: keeps harmful things out, and limits transepidermal water loss."},
      {prompt:"Which epidermal layer exists only in the palms and soles?", options:["Stratum basale","Stratum lucidum","Stratum spinosum","Stratum granulosum"], answer:1, explain:"Stratum lucidum ('clear layer') is unique to thick, glabrous skin."},
      {prompt:"In the palms, which layer sits directly beneath the stratum corneum?", options:["Stratum basale","Stratum spinosum","Stratum lucidum","Stratum granulosum"], answer:2, explain:"Order in thick skin: corneum → lucidum → granulosum → spinosum → basale."},
      {prompt:"Which is the deepest epidermal layer, sitting directly on the dermis?", options:["Stratum corneum","Stratum granulosum","Stratum lucidum","Stratum basale"], answer:3, explain:"Stratum basale is the germinative layer — new keratinocytes are born here."},
      {prompt:"Alongside keratohyaline granules, the stratum granulosum also produces lamellar granules — also known as:", options:["Birbeck granules","Odland bodies","Weibel-Palade bodies","Melanosomes"], answer:1, explain:"Lamellar granules are also called Odland bodies or cementosomes — they release lipid that helps seal the skin barrier."}
    ]
  },
  {
    id:'u2', num:2, zone:'epi',
    title:'Filaggrin, Desmosomes & the Basal Layer',
    guide:{ bullets:[
        '<b>Profilaggrin</b> (inactive) is processed into <b>filaggrin</b> (active), which aggregates keratin filaments.',
        'A filaggrin mutation is linked to <b>ichthyosis vulgaris</b> and <b>atopic dermatitis.</b>',
        '<b>Desmosomes</b> spot-weld keratinocytes together — most visible as "spines" in the stratum spinosum. Autoantibodies here cause the <b>pemphigus</b> group.',
        'Stratum basale = a single row of columnar cells with a central nucleus, a.k.a. <b>stratum germinativum.</b>',
        'Spinosum + basale together are called the <b>Malpighian layer.</b>',
        '<b>Rete ridges</b> are projections of epidermis down into the dermis; <b>dermal papillae</b> are the dermis pushing up into the epidermis — same interlocking border, opposite direction.'
      ] },
    questions:[
      {prompt:"Filaggrin's inactive precursor is called:", options:["Keratohyalin","Profilaggrin","Involucrin","Loricrin"], answer:1, explain:"Profilaggrin (inactive) → filaggrin (active) once processed in the granular layer."},
      {prompt:"What is filaggrin's main structural job?", options:["Producing melanin","Aggregating keratin intermediate filaments","Forming desmosomes","Secreting sebum"], answer:1, explain:"It's the 'filament aggregating protein' — bundles keratin filaments to support the barrier."},
      {prompt:"A filaggrin mutation is classically linked to ichthyosis vulgaris and:", options:["Psoriasis","Atopic dermatitis","Lichen planus","Vitiligo"], answer:1, explain:"Both conditions share this barrier-protein defect."},
      {prompt:"The spiny look of the stratum spinosum comes from prominent:", options:["Melanosomes","Hemidesmosomes","Desmosomes","Birbeck granules"], answer:2, explain:"Desmosomes are the intercellular 'spot welds' between keratinocytes here."},
      {prompt:"Autoantibodies against desmosomes cause which group of blistering disorders?", options:["Pemphigoid","Dermatitis herpetiformis","Pemphigus","Epidermolysis bullosa"], answer:2, explain:"Losing desmosomal attachment is the defining mechanism of the pemphigus group."},
      {prompt:"Which layer is a single row of columnar cells with a central nucleus?", options:["Stratum spinosum","Stratum granulosum","Stratum basale","Stratum lucidum"], answer:2, explain:"This is the dividing, germinative layer — stratum basale."},
      {prompt:"Another name for the stratum basale is the stratum:", options:["Corneum","Germinativum","Lucidum","Reticulum"], answer:1, explain:"'Germinativum' reflects its role generating new keratinocytes."},
      {prompt:"Which two layers together form the 'Malpighian layer'?", options:["Corneum + lucidum","Granulosum + spinosum","Spinosum + basale","Basale + corneum"], answer:2, explain:"Stratum spinosum and stratum basale together = Malpighian layer."},
      {prompt:"Rete ridges are best described as:", options:["Extensions of dermis into the epidermis","Projections of epidermis down into the dermis","A synonym for the DEJ","Found only in the hypodermis"], answer:1, explain:"Rete ridges = epidermis dipping down into dermis — the opposite direction from dermal papillae."},
      {prompt:"Dermal papillae are:", options:["Projections of epidermis into dermis","Extensions of dermis up into the epidermis","Another name for rete ridges","Found in the stratum corneum"], answer:1, explain:"They interlock with rete ridges but point the opposite way — dermis reaching up into epidermis."}
    ]
  },
  {
    id:'u3', num:3, zone:'epi',
    title:'Epidermal Turnover & Its Cells',
    guide:{ bullets:[
        'Normal <b>epidermal transit time</b> — basale to corneum — is about <b>4 weeks.</b> It shortens sharply in psoriasis, driving faster, incomplete turnover.',
        '<b>Keratinocytes</b> make up ~90% of the epidermis, from ectoderm. Their structural hallmark is the <b>keratin intermediate filament (KIF)</b>, which gives them structural integrity.',
        'The other 10% — three specialist cells, each with its own home and job.'
      ],
      cells:[
        {name:'Langerhans cell', cls:'lang', facts:'Lives in <b>stratum spinosum</b> · from mesoderm/bone marrow · "tennis-racket" Birbeck granules on EM · antigen-presenting cell · markers <b>CD1a, CD207 (langerin)</b> → key in Langerhans cell histiocytosis.'},
        {name:'Melanocyte', cls:'mel', facts:'Lives in <b>stratum basale</b> · from neural crest · converts tyrosine → melanin (UV protection) · markers <b>S100, HMB-45, Melan-A</b> → key in melanoma.'},
        {name:'Merkel cell', cls:'mer', facts:'Lives in <b>stratum basale</b> · from ectoderm · fine-touch, slow-adapting mechanoreceptor · marker <b>cytokeratin 20</b> → key in Merkel cell carcinoma.'}
      ] },

/* ============================= STATE ============================= */
const STORE_KEY = 'derm-app-state';
let state = null;
let app = { screen:'loading', chapterId:null, unitId:null, qIndex:0, order:[], answered:null, correctCount:0, xpGained:0, reviewQueue:[] };

function defaultState(){ return { xp:0, streak:0, lastActive:null, unitStars:{}, boxes:{}, mistakes:[], testMode:false }; }

function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }

async function loadState(){
  try{
    if(hasClaudeStorage()){
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){ state = JSON.parse(res.value); }
      else { state = defaultState(); }
    } else {
      const raw = localStorage.getItem(STORE_KEY);
      state = raw ? JSON.parse(raw) : defaultState();
    }
  }catch(e){ state = defaultState(); }
  touchStreak();
  await saveState();
  app.screen = 'dashboard';
  render();
}
async function saveState(){
  try{
    if(hasClaudeStorage()){
      await window.storage.set(STORE_KEY, JSON.stringify(state), false);
    } else {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }
  }catch(e){}
}
function touchStreak(){
  const today = new Date().toDateString();
  if(state.lastActive !== today){
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    state.streak = (state.lastActive === yesterday) ? state.streak + 1 : 1;
    state.lastActive = today;
  }
}

/* ============================= HELPERS ============================= */
function chapterById(id){ return CHAPTERS.find(c=>c.id===id); }
function unitKey(chId, unitId){ return chId+'::'+unitId; }
function qKey(chId, unitId, idx){ return chId+'::'+unitId+'::q'+idx; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function unitById(ch, id){ return ch.units.find(u=>u.id===id); }
function isUnitUnlocked(ch, idx){ if(state.testMode) return true; if(idx===0) return true; const prev=ch.units[idx-1]; return state.unitStars[unitKey(ch.id, prev.id)] !== undefined; }
function allMistakeCount(){ return state.mistakes.length; }
function builtChapterCount(){ return CHAPTERS.filter(c=>c.built).length; }

function recordAnswer(key, correct){
  const box = (state.boxes[key] && state.boxes[key].box) || 0;
  if(correct){
    state.boxes[key] = { box: Math.min(box+1, 4) };
    state.mistakes = state.mistakes.filter(id => id !== key);
    state.xp += 10; return 10;
  }else{
    state.boxes[key] = { box: 0 };
    if(!state.mistakes.includes(key)) state.mistakes.push(key);
    state.xp += 2; return 2;
  }
}
function starsFor(pct){ if(pct>=90) return 3; if(pct>=70) return 2; if(pct>=50) return 1; return 0; }

/* ============================= RENDER ============================= */
function render(){
  const root = document.getElementById('root');
  if(app.screen==='loading'){ root.innerHTML = '<div class="empty-note">Loading…</div>'; return; }
  if(app.screen==='dashboard') return renderDashboard(root);
  if(app.screen==='chapterList') return renderChapterList(root);
  if(app.screen==='chapterMap') return renderChapterMap(root);
  if(app.screen==='unit') return renderUnitIntro(root);
  if(app.screen==='quiz') return renderQuiz(root);
  if(app.screen==='results') return renderResults(root);
  if(app.screen==='review-empty') return renderReviewEmpty(root);
}

}

function renderChapterMap(root){
  const ch = chapterById(app.chapterId);
  const zones = CH_ZONES[ch.id] || {};
  let html = topbar(true, 'goChapterList');
  html += `<div class="chapter-label">Chapter ${ch.num}</div><div class="chapter-title">${ch.title}</div>`;

  if(!ch.units){
    html += `<div class="guide-card" style="margin-top:22px">
      <div class="guide-title">Source pages not included</div>
      <div class="guide-text">The uploaded document ends at page 150, while this chapter is listed in the contents but its teaching pages are not present in this file. No questions have been generated here so that the project does not add material from outside the source.</div>
    </div>`;
    html += `<div style="height:70px;"></div>`;
    root.innerHTML = html;
    return;
  }

  let lastZone = null;
  ch.units.forEach((u, idx)=>{
    const zm = zones[u.zone] || {label:'📖 Line-by-Line Pass', hue:'gold'};
    if(u.zone !== lastZone){
      html += `<div class="zone zone-${zm.hue}"><div class="zone-heading"><span class="ln"></span>${zm.label}<span class="ln"></span></div>`;
      lastZone = u.zone;
    } else {
      html += `<div class="zone zone-${zm.hue}">`;
    }
    const unlocked = isUnitUnlocked(ch, idx);
    const stars = state.unitStars[unitKey(ch.id,u.id)];
    const done = stars !== undefined;
    let nodeClass = 'node ' + (done ? 'done' : unlocked ? ('hue-'+zm.hue+' unlocked') : 'locked');
    const inner = done ? '✓' : unlocked ? u.num : '<span class="lock-ic">🔒</span>';
    const onclick = unlocked ? `onclick="openUnit('${u.id}')"` : '';
    html += `<div class="node-wrap">
        <button class="${nodeClass}" ${onclick}>${inner}</button>
        <div class="node-label">${u.title}</div>
        <div class="node-stars">${done ? '★'.repeat(stars) + '☆'.repeat(3-stars) : ''}</div>
      </div></div>`;
    if(idx < ch.units.length-1) html += `<div class="zone-connector"></div>`;
  });
  html += `<div style="height:70px;"></div>`;
  if(allMistakeCount() > 0){
    html += `<button class="review-fab" onclick="startReview()">↻ Review mistakes <span class="badge">${allMistakeCount()}</span></button>`;
  }
  root.innerHTML = html;
}

function startQuiz(unitId){
  const ch = chapterById(app.chapterId);
  const u = unitById(ch, unitId);
  app.unitId = unitId;
  app.reviewQueue = [];
  app.order = shuffle(u.questions.map((_,i)=>i));
  app.qIndex = 0; app.answered = null; app.correctCount = 0; app.xpGained = 0;
  app.screen = 'quiz';
  render();
}
function startReview(){
  const pool = [];
  CHAPTERS.forEach(ch=>{
    if(!ch.built) return;
    ch.units.forEach(u=>{
      u.questions.forEach((q, i)=>{
        const key = qKey(ch.id, u.id, i);
        if(state.mistakes.includes(key)) pool.push({chapterId:ch.id, unitId:u.id, qIndex:i, q});
      });
    });
  });
  if(pool.length===0){ app.screen='review-empty'; render(); return; }
  app.chapterId = null; app.unitId = 'review';
  app.reviewQueue = shuffle(pool);
  app.order = app.reviewQueue.map((_,i)=>i);
  app.qIndex = 0; app.answered=null; app.correctCount=0; app.xpGained=0;
  app.screen='quiz';
  render();
}
function currentQuestion(){
  if(app.unitId==='review'){
    const item = app.reviewQueue[app.order[app.qIndex]];
    return { q:item.q, key:qKey(item.chapterId, item.unitId, item.qIndex) };
  }
  const ch = chapterById(app.chapterId);
  const u = unitById(ch, app.unitId);
  const realIdx = app.order[app.qIndex];
  return { q:u.questions[realIdx], key:qKey(ch.id, u.id, realIdx) };
}

function renderQuiz(root){
  const total = app.order.length;
  const {q} = currentQuestion();
  const pct = Math.round((app.qIndex/total)*100);
  if(!app._optOrder || app._optOrderFor !== app.qIndex){ app._optOrder = shuffle(q.options.map((_,i)=>i)); app._optOrderFor = app.qIndex; }
  const opts = app._optOrder.map(i=>q.options[i]);
  const correctDisplay = app._optOrder.indexOf(q.answer);

  let html = topbar(true, app.unitId==='review' ? 'goDashboard' : 'goUnitIntro');
  html += `<div class="screen">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-count">${app.unitId==='review' ? 'REVIEW' : 'QUESTION'} ${app.qIndex+1} OF ${total}</div>
    <div class="q-prompt">${q.prompt}</div>`;
  opts.forEach((opt, i)=>{
    let cls = 'option'; let disabled = '';
    if(app.answered !== null){
      disabled = 'disabled';
      if(i === correctDisplay) cls += ' correct';
      else if(i === app.answered) cls += ' wrong';
      else cls += ' dim';
    }
    html += `<button class="${cls}" ${disabled} onclick="selectOption(${i}, ${correctDisplay})">${opt}</button>`;
  });
  if(app.answered !== null){
    const ok = app.answered === correctDisplay;
    html += `<div class="feedback ${ok?'ok':'no'}"><span class="ic">${ok?'✓':'✕'}</span><span>${q.explain}</span></div>`;
    html += `<button class="primary-btn" onclick="nextQuestion()">${app.qIndex+1===total ? 'See results' : 'Continue'}</button>`;
  }
  html += `</div>`;
  root.innerHTML = html;
}

function selectOption(i, correctDisplay){
  if(app.answered !== null) return;
  app.answered = i;
  const {key} = currentQuestion();
  const ok = i === correctDisplay;
  if(ok) app.correctCount++;
  const gained = recordAnswer(key, ok);
  app.xpGained += gained;
  saveState();
  render();
  showXpPopup(gained);
}
function showXpPopup(n){
  const el = document.createElement('div'); el.className = 'xp-pop'; el.textContent = '+' + n + ' XP';
  document.body.appendChild(el); setTimeout(()=>el.remove(), 1100);
}
function nextQuestion(){
  if(app.qIndex+1 < app.order.length){ app.qIndex++; app.answered = null; render(); }
  else{ finishQuiz(); }
}
function finishQuiz(){
  const total = app.order.length;
  const pct = Math.round((app.correctCount/total)*100);
  if(app.unitId !== 'review'){
    const stars = starsFor(pct);
    const key = unitKey(app.chapterId, app.unitId);
    const prevStars = state.unitStars[key];
    state.unitStars[key] = (prevStars===undefined) ? stars : Math.max(prevStars, stars);
    saveState();
  }
  app._resultsPct = pct;
  app.screen = 'results';
  render();
}

function renderResults(root){
  const total = app.order.length;
  const pct = app._resultsPct;
  const stars = starsFor(pct);
  let html = topbar(true, app.unitId==='review' ? 'goDashboard' : 'goChapterMap');
  html += `<div class="results-wrap">
    <div class="results-ring" style="--pct:${pct}"><div class="inner"><div class="pctnum mono">${pct}%</div><div class="pctlbl">ACCURACY</div></div></div>
    <div class="results-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <h2>${app.unitId==='review' ? 'Review complete' : 'Unit complete'}</h2>
    <div class="results-row">
      <div class="rstat"><div class="v">${app.correctCount}/${total}</div><div class="l">Correct</div></div>
      <div class="rstat"><div class="v">+${app.xpGained}</div><div class="l">XP earned</div></div>
      <div class="rstat"><div class="v">${state.streak}</div><div class="l">Day streak</div></div>
    </div>`;
  if(allMistakeCount() > 0){
    html += `<button class="primary-btn" onclick="startReview()">Review ${allMistakeCount()} mistake${allMistakeCount()>1?'s':''}</button>`;
  }
  html += `<button class="secondary-btn" onclick="${app.unitId==='review' ? 'goDashboard' : 'goChapterMap'}()">Back</button></div>`;
  root.innerHTML = html;
}

function renderReviewEmpty(root){
  let html = topbar(true, 'goDashboard');
  html += `<div class="results-wrap">
    <div style="font-size:50px; margin-bottom:14px;">✨</div>
    <h2>No mistakes to review</h2>
    <div class="empty-note" style="padding:0 0 20px;">Every question you've missed so far has been cleared. Keep going with new units.</div>
    <button class="primary-btn" onclick="goDashboard()">Back to dashboard</button>
  </div>`;
  root.innerHTML = html;
}

function goDashboard(){ app.screen='dashboard'; app.chapterId=null; app.unitId=null; app._optOrder=null; render(); }
function toggleTestMode(){ state.testMode = !state.testMode; saveState(); render(); }
function goChapterList(){ app.screen='chapterList'; app._optOrder=null; render(); }
function openChapter(id){ app.chapterId=id; app.screen='chapterMap'; render(); }
function goChapterMap(){ app.screen='chapterMap'; app._optOrder=null; render(); }
function openUnit(id){ app.unitId=id; app.screen='unit'; render(); }
function goUnitIntro(){ app.screen='unit'; render(); }

loadState();
</script>
</body>
</html>
